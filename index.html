<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electron Delivery</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        
        <!-- 화면 1: 인트로 -->
        <div id="screen-intro" class="screen active">
            <h1 class="neon-text">ELECTRON<br>DELIVERY</h1>
            <p class="subtitle">이온화 경향성을 비교하고 계수를 맞추세요!</p>
            
            <form id="info-form">
                <div class="input-group"><input type="number" id="grade" placeholder="학년" required></div>
                <div class="input-group"><input type="number" id="classNum" placeholder="반" required></div>
                <div class="input-group"><input type="number" id="studentNum" placeholder="번호" required></div>
                <div class="input-group"><input type="text" id="name" placeholder="이름" required></div>
                <button type="submit" class="neon-btn">GAME START</button>
            </form>
        </div>

        <!-- 화면 2: 메인 게임 -->
        <div id="screen-game" class="screen">
            <div class="hud">
                <div class="timer">TIME <span id="time-display" class="neon-sub">10:00</span></div>
                <div class="score">SCORE <span id="score-display" class="neon-sub">0</span></div>
            </div>
            
            <div class="play-field">
                <div class="material" id="mat-left">
                    <h3>물질 A</h3>
                    <div class="element"></div>
                    <div class="electron" draggable="true">e-</div>
                </div>
                
                <div class="material" id="mat-right">
                    <h3>물질 B</h3>
                    <div class="element"></div>
                    <div class="electron" draggable="true">e-</div>
                </div>
            </div>

            <!-- ★ 반응 없음 버튼 추가 ★ -->
            <button id="btn-no-reaction" class="neon-btn small" style="margin: 10px auto; display: block; border-color: #ffaa00; color: #ffaa00;">반응 일어나지 않음 (No Reaction)</button>

            <p id="feedback-msg" style="text-align:center; height:20px; font-weight:bold; margin-top:5px;"></p>

            <div class="reaction-formula">
                <p><span id="reactants-text">[ ? ] + [ ? ]</span> → <br><span class="blank">[ ? ]</span> <span class="blank"></span></p>
            </div>
            
            <button id="temp-end-btn" class="neon-btn small" style="margin-top: 15px;">강제 종료 (테스트용)</button>

            <!-- ★ 전자 개수 선택 모달 팝업 ★ -->
            <div id="electron-modal" class="modal hidden">
                <div class="modal-content">
                    <h3>전자가 몇 개 이동할까요?</h3>
                    <div class="e-btn-group">
                        <button class="e-btn" data-val="1">1 개</button>
                        <button class="e-btn" data-val="2">2 개</button>
                        <button class="e-btn" data-val="3">3 개</button>
                        <button class="e-btn" data-val="6">6 개</button>
                    </div>
                    <button id="btn-modal-close" class="neon-btn small" style="margin-top:20px; border-color:red; color:red;">취소 (다시 생각하기)</button>
                </div>
            </div>
        </div>

        <!-- 화면 3: 결과 -->
        <div id="screen-result" class="screen">
            <h1 class="neon-text">GAME OVER</h1>
            <div class="result-info">
                <p id="result-player">플레이어: -</p>
                <p class="final-score">최종 점수: <br><span id="final-score-display">0</span> Pt</p>
            </div>
            <button id="btn-restart" class="neon-btn">처음으로</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
